<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unordered List</title>
</head>
<body>
    <p>Unordered List: list and group related items for better readibility</p>
    <!-- ul: unordered list | li:List | Items are listed with bullets-->
    <ul>
        <li>Apple</li>
        <li>Banana</li>
    </ul>
    <p>ordered list:ol:list the items by numbering them</p>
    <ol>
        <li>Laptop</li>
        <li>phone</li>
        <li>ipadg</li>
    </ol>
    
</body>
</html>
